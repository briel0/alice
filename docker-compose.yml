services:
  alice:
    build: .
    container_name: alice-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: alice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alice_secret_123}
      POSTGRES_DB: ${POSTGRES_DB:-alice_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
