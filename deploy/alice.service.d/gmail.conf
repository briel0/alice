# Filtro de e-mails (item 14): entrega o token do Gmail ao serviço sem abrir /etc/alice (root, 700) ao usuário alice.
# O systemd copia o arquivo para /run/credentials/alice.service/ a cada início; só instale depois do token existir.
[Service]
LoadCredential=gmail-token.json:/etc/alice/gmail-token.json
